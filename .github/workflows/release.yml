name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # closing the version's milestone

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, to find the previous release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag that doesn't match manifest.json would publish a zip that
      # reports a different version than the release it's attached to
      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "${{ github.ref_name }}" = "v$v" ] || { echo "Tag ${{ github.ref_name }} != manifest v$v"; exit 1; }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # Release notes are this version's section of the README changelog
      - name: Extract release notes
        run: |
          awk -v tag="### ${{ github.ref_name }} " '
            index($0, tag) == 1 { on = 1; next }
            on && /^### v/ { exit }
            on && /^---$/ { exit }
            on { print }
          ' README.md > release-notes.md
          [ -s release-notes.md ] || { echo "No changelog section for ${{ github.ref_name }} in README.md"; exit 1; }

      - name: Build Chrome
        run: pnpm build
        env:
          VITE_VERSION: ${{ github.ref_name }}

      # ── Firefox build (Phase 6) ───────────────────────────────────────────────
      # Uncomment once Firefox manifest and compat work is complete:
      #
      # - name: Build Firefox
      #   run: pnpm build:firefox
      #   env:
      #     VITE_VERSION: ${{ github.ref_name }}

      - name: Package Chrome extension
        run: |
          cd dist
          zip -r ../clearpath-chrome-${{ github.ref_name }}.zip .
          # Same file without the version, so the website can link to
          # releases/latest/download/clearpath-chrome.zip and never go stale
          cp ../clearpath-chrome-${{ github.ref_name }}.zip ../clearpath-chrome.zip

      # - name: Package Firefox extension
      #   run: |
      #     cd dist-firefox
      #     zip -r ../clearpath-firefox-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clearpath-chrome-${{ github.ref_name }}.zip
            clearpath-chrome.zip
          body_path: release-notes.md
          generate_release_notes: false
          draft: false

      # ── Store submission (Phase 6) ────────────────────────────────────────────
      # Uncomment once store accounts and secrets are configured:
      #
      # - name: Publish to Chrome Web Store
      #   uses: trmcnvn/chrome-addon@v2
      #   with:
      #     extension: ${{ secrets.CHROME_EXTENSION_ID }}
      #     zip: clearpath-chrome-${{ github.ref_name }}.zip
      #     client-id: ${{ secrets.CHROME_CLIENT_ID }}
      #     client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
      #     refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
      #
      # - name: Install web-ext
      #   run: pnpm add -g web-ext
      #
      # - name: Sign & Submit Firefox extension
      #   run: |
      #     web-ext sign \
      #       --source-dir ./dist-firefox \
      #       --api-key ${{ secrets.FIREFOX_API_KEY }} \
      #       --api-secret ${{ secrets.FIREFOX_API_SECRET }} \
      #       --channel listed

      # Every release gets a release/vX.Y.Z branch at the tag's commit, like
      # release/v0.1.0 through release/v0.7.0
      - name: Create release branch
        run: git push origin "${{ github.ref_name }}^{commit}:refs/heads/release/${{ github.ref_name }}"

      # GitHub milestones can only hold issues and PRs, so the milestone links
      # everything else: release notes, tag, branch, and the commits since the
      # previous release. Then it's closed. No milestone with this title: skip.
      - name: Close the milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          number=$(gh api "repos/$REPO/milestones?state=all&per_page=100" --jq ".[] | select(.title == \"$TAG\") | .number")
          if [ -z "$number" ]; then echo "No $TAG milestone"; exit 0; fi
          url="https://github.com/$REPO"
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            count=$(git rev-list --count "$prev..$TAG"); commits="$url/compare/$prev...$TAG"; since="$prev"
          else
            count=$(git rev-list --count "$TAG"); commits="$url/commits/$TAG"; since="the start"
          fi
          summary=$(gh api "repos/$REPO/milestones/$number" --jq '.description' | head -1)
          printf -v desc '%s\nReleased %s.\nRelease notes: %s/releases/tag/%s\nTag: %s/tree/%s\nBranch: %s/tree/release/%s\nCommits (%s since %s): %s' \
            "$summary" "$(date -u +%Y-%m-%d)" "$url" "$TAG" "$url" "$TAG" "$url" "$TAG" "$count" "$since" "$commits"
          gh api -X PATCH "repos/$REPO/milestones/$number" -f state=closed -f description="$desc" -f due_on="$(date -u +%Y-%m-%dT23:59:59Z)" --jq '"Closed \(.title)"'
