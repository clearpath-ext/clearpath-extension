name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Chrome
        run: pnpm build
        env:
          VITE_VERSION: ${{ github.ref_name }}

      # ── Firefox build (Phase 6) ───────────────────────────────────────────────
      # Uncomment once Firefox manifest and compat work is complete:
      #
      # - name: Build Firefox
      #   run: pnpm build:firefox
      #   env:
      #     VITE_VERSION: ${{ github.ref_name }}

      - name: Package Chrome extension
        run: |
          cd dist
          zip -r ../clearpath-chrome-${{ github.ref_name }}.zip .

      # - name: Package Firefox extension
      #   run: |
      #     cd dist-firefox
      #     zip -r ../clearpath-firefox-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clearpath-chrome-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false

