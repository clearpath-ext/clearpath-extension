name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag that doesn't match manifest.json would publish a zip that
      # reports a different version than the release it's attached to
      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "${{ github.ref_name }}" = "v$v" ] || { echo "Tag ${{ github.ref_name }} != manifest v$v"; exit 1; }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # Release notes are this version's section of the README changelog
      - name: Extract release notes
        run: |
          awk -v tag="### ${{ github.ref_name }} " '
            index($0, tag) == 1 { on = 1; next }
            on && /^### v/ { exit }
            on && /^---$/ { exit }
            on { print }
          ' README.md > release-notes.md
          [ -s release-notes.md ] || { echo "No changelog section for ${{ github.ref_name }} in README.md"; exit 1; }

      - name: Build Chrome
        run: pnpm build
        env:
          VITE_VERSION: ${{ github.ref_name }}

      # ── Firefox build (Phase 6) ───────────────────────────────────────────────
      # Uncomment once Firefox manifest and compat work is complete:
      #
      # - name: Build Firefox
      #   run: pnpm build:firefox
      #   env:
      #     VITE_VERSION: ${{ github.ref_name }}

      - name: Package Chrome extension
        run: |
          cd dist
          zip -r ../clearpath-chrome-${{ github.ref_name }}.zip .
          # Same file without the version, so the website can link to
          # releases/latest/download/clearpath-chrome.zip and never go stale
          cp ../clearpath-chrome-${{ github.ref_name }}.zip ../clearpath-chrome.zip

      # - name: Package Firefox extension
      #   run: |
      #     cd dist-firefox
      #     zip -r ../clearpath-firefox-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clearpath-chrome-${{ github.ref_name }}.zip
            clearpath-chrome.zip
          body_path: release-notes.md
          generate_release_notes: false
          draft: false

